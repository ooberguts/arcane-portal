name: Desktop builds

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: Arcane-Portal-Windows-x64
          - name: macOS Apple silicon
            runner: macos-26
            target: aarch64-apple-darwin
            package: Arcane-Portal-macOS-Apple-silicon
          - name: macOS Intel
            runner: macos-26-intel
            target: x86_64-apple-darwin
            package: Arcane-Portal-macOS-Intel
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target '${{ matrix.target }}'
          rustup default stable
      - name: Report macOS compiler and SDK
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Set up Windows codec assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '2.16.03'
          $zip = Join-Path $env:RUNNER_TEMP "nasm-$version.zip"
          $path = Join-Path $env:RUNNER_TEMP 'arcane-nasm'
          try {
            Invoke-WebRequest "https://www.nasm.us/pub/nasm/releasebuilds/$version/win64/nasm-$version-win64.zip" -OutFile $zip -TimeoutSec 30
          } catch {
            Invoke-WebRequest "https://www.nasm.dev/pub/nasm/releasebuilds/$version/win64/nasm-$version-win64.zip" -OutFile $zip -TimeoutSec 30
          }
          if ((Get-FileHash $zip).Hash -ne '3EE4782247BCB874378D02F7EAB4E294A84D3D15F3F6EE2DE2F47A46AA7226E6') {
            throw 'The portable NASM archive failed checksum verification.'
          }
          Expand-Archive $zip $path
          Join-Path $path "nasm-$version" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Set up Intel Mac codec assembler
        if: matrix.target == 'x86_64-apple-darwin'
        run: command -v nasm || brew install nasm
      - name: Check formatting and run tests
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --release --locked --target '${{ matrix.target }}'
      - name: Build application
        shell: bash
        run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Target '${{ matrix.target }}' -Package '${{ matrix.package }}'
      - name: Package Mac application
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/package-macos.sh '${{ matrix.target }}' '${{ matrix.package }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Arcane-Portal-*
          path: dist
          merge-multiple: true
      - name: Publish release with all three packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Arcane-Portal-Windows-x64.zip \
            dist/Arcane-Portal-macOS-Apple-silicon.zip \
            dist/Arcane-Portal-macOS-Intel.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Arcane Portal $GITHUB_REF_NAME" \
            --notes 'Smoother LAN viewing with H.264 video, a short playback buffer, and automatic bitrate reduction when a viewer falls behind. Update both devices to use the new video path. Check for updates from Settings → Updates, or install the ZIP for your platform. On macOS, move Arcane Portal.app into Applications using Finder before opening it.'
