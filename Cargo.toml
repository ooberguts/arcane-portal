[package]
name = "arcane-portal"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "Share or watch a screen on your local network."
repository = "https://github.com/ooberguts/arcane-portal"
publish = false

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
mdns-sd = "0.21.6"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "12.0.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
